spring:
  application:
    name: festpass
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/festpass}
    username: ${DB_USERNAME:festpass}
    password: ${DB_PASSWORD:festpass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    properties:
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

festpass:
  mail-from: ${MAIL_FROM:tickets@festpass.local}
  # Times in PDFs, emails and calendar descriptions are shown in this zone.
  display-zone: Asia/Kolkata
  # Signs QR codes (HMAC-SHA256). Set QR_SECRET in any shared or deployed environment.
  qr-secret: ${QR_SECRET:dev-only-qr-secret-change-me}
  scheduling:
    enabled: true
  holds:
    expiry-interval: 5s
  payment:
    # The mock gateway waits a random time in this range to feel like a real one.
    mock-latency-min: 500ms
    mock-latency-max: 2000ms
  rate-limit:
    holds-per-second: 5
    holds-per-minute: 30
  queue:
    # Flash-drop waiting room: admit this many people every interval once the sale opens.
    batch-size: 50
    admit-interval: 5s
    # How long an admitted person may start holding seats.
    admission-window: 10m
  websocket:
    # Other origins allowed to open /ws (same-origin is always allowed). The Vite dev server runs on :5173.
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173

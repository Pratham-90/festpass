spring:
  application:
    name: festpass
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/festpass}
    username: ${DB_USERNAME:festpass}
    password: ${DB_PASSWORD:festpass}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  mvc:
    problemdetails:
      enabled: true

server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
  error:
    include-stacktrace: never
    include-message: never

festpass:
  mail-from: ${MAIL_FROM:tickets@festpass.local}
